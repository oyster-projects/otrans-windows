<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>OTrans</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="logo">O</div><div><h1>OTrans</h1><p>你的私有中转站</p></div></div>
        <div id="connection-pill" class="connection-pill offline"><span></span><b>未连接</b></div>
      </header>
      <main>
        <section id="setup-card" class="card setup-card">
          <div class="section-heading"><div><p class="eyebrow">首次连接</p><h2>连接到飞牛服务器</h2></div></div>
          <p class="muted">优先尝试内网地址；不可用时自动切换到外网地址。配对码由飞牛管理页生成，10 分钟内有效。</p>
          <form id="pair-form" class="form-grid">
            <label><span>内网地址</span><input id="pair-lan-url" type="url" placeholder="http://192.168.1.10:18990" /></label>
            <label><span>外网地址（可选）</span><input id="pair-wan-url" type="url" placeholder="https://你的域名" /></label>
            <label><span>电脑名称</span><input id="pair-device-name" required /></label>
            <label><span>配对码</span><input id="pair-code" required autocomplete="one-time-code" placeholder="输入飞牛管理页生成的配对码" /></label>
            <button class="primary full" type="submit">连接这台电脑</button>
          </form>
        </section>
        <section id="workspace" class="workspace hidden">
          <div class="hero card">
            <div><p class="eyebrow">当前设备</p><h2 id="device-title">Windows PC</h2><p id="route-summary" class="muted">正在检查连接…</p></div>
            <div class="hero-actions"><button id="sync-button" class="secondary">立即同步</button><button id="settings-button" class="ghost">设置</button></div>
          </div>
          <section class="card composer">
            <div class="section-heading"><div><p class="eyebrow">发送</p><h2>待发送内容</h2></div><button id="clear-draft" class="text-button">清空</button></div>
            <div id="drop-zone" class="drop-zone" tabindex="0"><div class="drop-icon">＋</div><strong>拖入文件、图片或文字</strong><span>支持多个文件混合发送，也可以使用下面的按钮添加</span></div>
            <textarea id="draft-text" rows="4" placeholder="输入或粘贴要发送的文字…"></textarea>
            <div class="composer-actions"><button id="clipboard-button" class="secondary">读取剪切板</button><button id="choose-files-button" class="secondary">选择文件</button><span id="draft-count" class="draft-count">暂无附件</span></div>
            <div id="draft-files" class="draft-files"></div>
            <button id="send-button" class="primary send-button" disabled>发送到中转站</button>
          </section>
          <div class="lower-grid">
            <section class="card"><div class="section-heading"><div><p class="eyebrow">存储</p><h2>接收文件夹</h2></div></div><p id="inbox-path" class="path"></p><button id="open-inbox-button" class="secondary">打开文件夹</button></section>
            <section class="card"><div class="section-heading"><div><p class="eyebrow">最近记录</p><h2>传送动态</h2></div></div><div id="activity-list" class="activity-list"><p class="muted">暂无传送记录</p></div></section>
          </div>
        </section>
      </main>
    </div>
    <dialog id="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="dialog-heading"><div><p class="eyebrow">客户端</p><h2>连接与存储设置</h2></div><button id="close-settings" type="button" class="icon-button">×</button></div>
        <div class="form-grid">
          <label><span>内网地址</span><input id="settings-lan-url" type="url" /></label>
          <label><span>外网地址（可选）</span><input id="settings-wan-url" type="url" /></label>
          <label><span>电脑名称</span><input id="settings-device-name" required /></label>
          <label class="path-field"><span>接收文件夹</span><div><input id="settings-inbox" required /><button type="button" data-pick="inbox">选择</button></div></label>
          <label class="path-field"><span>发送文件夹</span><div><input id="settings-outbox" required /><button type="button" data-pick="outbox">选择</button></div></label>
          <label class="check"><input id="settings-autostart" type="checkbox" /><span>登录 Windows 时自动启动</span></label>
        </div>
        <div class="dialog-actions"><button id="disconnect-button" type="button" class="danger">断开配对</button><span></span><button id="cancel-settings" type="button" class="secondary">取消</button><button class="primary" value="default">保存</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
