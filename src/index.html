<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>OTrans</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="logo">O</div><div><div class="brand-title"><h1>OTrans</h1><span id="app-version" class="version-badge">v…</span><div id="connection-pill" class="connection-pill offline"><span></span><b>未连接</b></div><button id="sync-button" class="title-sync-button" type="button">立即同步</button></div><p>你的私有中转站</p></div></div>
      </header>
      <main>
        <section id="workspace" class="workspace">
          <nav class="main-tabs" aria-label="主要功能">
            <div class="tab-buttons">
              <button type="button" class="tab-button active" data-tab="transfer"><span>传送</span><small>发送内容</small></button>
              <button type="button" class="tab-button" data-tab="activity"><span>记录 <b id="activity-tab-count">0</b></span><small>收发历史</small></button>
            </div>
            <div class="quick-actions"><button id="open-inbox-button" type="button">打开 Inbox</button><button id="open-outbox-button" type="button">打开 Outbox</button><button id="settings-button" class="tab-settings" type="button">设置</button></div>
          </nav>
          <section class="tab-panel active" data-tab-panel="transfer">
            <section class="card composer">
              <div class="section-heading"><div><p class="eyebrow">发送</p><h2>待发送内容</h2></div><button id="clear-draft" class="text-button">清空</button></div>
              <div id="drop-zone" class="drop-zone" tabindex="0"><div class="drop-icon">＋</div><strong>拖入文件、图片或文字</strong><span>支持多个文件混合发送，也可以使用下面的按钮添加</span></div>
              <textarea id="draft-text" rows="4" placeholder="输入或粘贴要发送的文字…（Ctrl + Enter 发送）"></textarea>
              <div class="composer-actions"><button id="clipboard-button" class="secondary">读取剪切板</button><button id="choose-files-button" class="secondary">选择文件</button><span id="draft-count" class="draft-count">暂无附件</span></div>
              <div id="draft-files" class="draft-files"></div>
              <button id="send-button" class="primary send-button" disabled>发送到中转站</button>
            </section>
          </section>
          <section class="tab-panel" data-tab-panel="activity" hidden>
            <section class="card activity-card activity-page">
              <div class="section-heading"><div><p class="eyebrow">最近记录</p><h2>传送动态 <span id="activity-count" class="heading-count">0</span></h2></div><button id="clear-activity-button" class="text-button" type="button">清空记录</button></div>
              <div class="activity-toolbar">
                <div class="filter-group" role="group" aria-label="筛选传送记录">
                  <button type="button" class="filter-button active" data-activity-filter="all">全部</button>
                  <button type="button" class="filter-button" data-activity-filter="received">收到</button>
                  <button type="button" class="filter-button" data-activity-filter="sent">发送</button>
                  <button type="button" class="filter-button" data-activity-filter="error">异常</button>
                </div>
                <input id="activity-search" type="search" placeholder="搜索记录" aria-label="搜索传送记录" />
              </div>
              <div id="activity-list" class="activity-list"><p class="muted">暂无传送记录</p></div>
            </section>
          </section>
        </section>
      </main>
    </div>
    <dialog id="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="dialog-heading"><div><p class="eyebrow">客户端</p><h2>连接与存储设置</h2></div><button id="close-settings" type="button" class="icon-button">×</button></div>
        <div class="settings-stack">
          <section class="settings-group"><div class="settings-group-title"><strong>服务器与设备</strong><span>优先使用内网地址，失败后自动切换外网</span></div><div class="form-grid">
            <label><span>内网地址</span><input id="settings-lan-url" type="url" /></label>
            <label><span>外网地址（可选）</span><input id="settings-wan-url" type="url" /></label>
            <label><span>电脑名称</span><input id="settings-device-name" required /></label>
            <label><span>10 分钟临时配对码</span><input id="settings-pair-code" autocomplete="one-time-code" placeholder="在飞牛管理页生成" /></label>
          </div></section>
          <section class="settings-group"><div class="settings-group-title"><strong>文件夹</strong><span>Inbox 接收内容，Outbox 中的新文件会自动发送</span></div><div class="form-grid">
            <label class="path-field"><span>接收文件夹</span><div><input id="settings-inbox" required /><button type="button" data-pick="inbox">选择</button></div></label>
            <label class="path-field"><span>自动发送文件夹（Outbox）</span><div><input id="settings-outbox" required /><button type="button" data-pick="outbox">选择</button></div></label>
          </div></section>
          <section class="settings-group"><div class="settings-group-title"><strong>后台能力</strong><span>控制直传、开机启动和系统通知</span></div><div class="form-grid settings-options">
            <label class="check"><input id="settings-lan-peer" type="checkbox" /><span>启用实验性局域网设备直传</span></label>
            <label class="check"><input id="settings-autostart" type="checkbox" /><span>登录 Windows 时自动启动</span></label>
            <p id="settings-peer-detail" class="peer-detail"></p>
            <button id="test-notification-button" type="button" class="secondary full">测试 Windows 通知</button>
            <button id="about-button" type="button" class="ghost full about-button">关于 OTrans</button>
          </div></section>
        </div>
        <div class="dialog-actions"><button id="pair-button" type="button" class="primary">使用配对码连接</button><button id="disconnect-button" type="button" class="danger">断开配对</button><span></span><button id="cancel-settings" type="button" class="secondary">取消</button><button class="primary" value="default">保存设置</button></div>
      </form>
    </dialog>
    <dialog id="about-dialog" class="about-dialog">
      <div class="about-content">
        <div class="about-logo">O</div>
        <h2>OTrans</h2>
        <p id="about-version" class="about-version">版本 v…</p>
        <p class="muted">轻量的私有跨设备中转站客户端</p>
        <div class="about-meta"><span>Rust + Tauri</span><span>同步协议 v3</span><span>Windows x64</span></div>
        <button id="close-about" type="button" class="primary">关闭</button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
